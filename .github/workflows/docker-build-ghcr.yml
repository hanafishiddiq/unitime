name: Build and Push UniTime Docker Image to GHCR

'on':
  push:
    branches:
      - main
    paths:
      - 'JavaSource/**'
      - 'WebContent/**'
      - 'pom.xml'
      - 'build.*'
      - '3rd_party/**'
      - 'Dockerfile'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and Push Docker Image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hanafishiddiq/unitime-web
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push UniTime Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-unitime-web:
    name: Deploy UniTime Web to Tencent VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Update UniTime Web container on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            echo "📥 Pulling latest UniTime Web image from GHCR..."
            cd /home/ubuntu/unitime
            docker compose -f docker-compose.prod.yml pull unitime-web
            docker compose -f docker-compose.prod.yml up -d unitime-web
            echo "⏳ Verifying container status..."
            docker ps --filter name=unitime-web --format "table {{.Names}}\t{{.Status}}"
            echo "✅ UniTime Web successfully updated!"
